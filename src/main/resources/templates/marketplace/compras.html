<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis Compras | PharmaSync Marketplace')}"></head>
<body class="bg-light">

    <!-- Universal Navbar for Marketplace -->
    <div th:replace="~{marketplace/index :: #mainNav}"></div>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark"><i class="fas fa-shopping-bag text-primary me-2"></i>Mis Compras</h2>
            <a th:href="@{/marketplace}" class="btn btn-outline-secondary rounded-pill px-4">Volver al Inicio</a>
        </div>

        <div class="row g-4">
            <div class="col-12" th:if="${#lists.isEmpty(compras)}">
                <div class="card border-0 shadow-sm rounded-4 p-5 text-center bg-white">
                    <i class="fas fa-box-open fa-3x text-muted mb-3 opacity-50"></i>
                    <h5 class="fw-bold text-muted">Aún no tienes compras realizadas</h5>
                    <p class="text-muted small">Explora el marketplace y adquiere tus medicamentos fácilmente.</p>
                    <div class="mt-3">
                        <a th:href="@{/marketplace}" class="btn btn-primary rounded-pill px-5">Explorar Marketplace</a>
                    </div>
                </div>
            </div>

            <div class="col-lg-6" th:each="c : ${compras}">
                <div class="card border-0 shadow-sm rounded-4 h-100 overflow-hidden bg-white">
                    <div class="card-header bg-white border-bottom p-3 d-flex justify-content-between align-items-center">
                        <span class="text-muted small fw-bold"><i class="fas fa-calendar-alt me-1"></i> <span th:text="${#temporals.format(c.fecha, 'dd MMM yyyy - HH:mm')}"></span></span>
                        <span th:classappend="${c.estado.name() == 'APROBADA' || c.estado.name() == 'PAGADA'} ? 'badge bg-success' : (${c.estado.name() == 'VALIDACION_PENDIENTE'} ? 'badge bg-warning text-dark' : 'badge bg-secondary')" 
                              class="rounded-pill" th:text="${c.estado}"></span>
                    </div>
                    <div class="card-body p-4">
                        <h5 class="fw-bold text-primary mb-3">Pedido: <span th:text="${c.numeroVenta}"></span></h5>
                        
                        <div class="d-flex flex-column gap-2 mb-3">
                            <div th:each="d : ${c.detalles}" class="d-flex justify-content-between align-items-center bg-light p-2 rounded-3">
                                <div class="d-flex align-items-center">
                                    <div class="bg-white rounded-circle p-2 shadow-sm me-3 border">
                                        <i class="fas fa-pills text-primary"></i>
                                    </div>
                                    <div>
                                        <h6 class="mb-0 fw-bold small text-truncate" style="max-width: 200px;" th:text="${d.producto.nombre}"></h6>
                                        <small class="text-muted"><span th:text="${d.cantidad}"></span> unidades</small>
                                    </div>
                                </div>
                                <span class="fw-bold small">S/ <span th:text="${#numbers.formatDecimal(d.subtotal, 1, 2)}"></span></span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <div>
                                <small class="text-muted d-block">Receta Médica</small>
                                <span th:if="${c.recetaPath != null}" class="badge bg-info text-white rounded-pill"><i class="fas fa-paperclip"></i> Adjuntado</span>
                                <span th:unless="${c.recetaPath != null}" class="text-muted small">-</span>
                            </div>
                            <div class="text-end">
                                <small class="text-muted d-block">Total</small>
                                <h4 class="fw-bold text-dark mb-0">S/ <span th:text="${#numbers.formatDecimal(c.total, 1, 2)}"></span></h4>
                            </div>
                        </div>
                    </div>
                    <!-- Action Button if Pending Payment -->
                    <div class="card-footer bg-white border-top p-3 text-center" th:if="${c.estado.name() == 'APROBADA'}">
                        <a th:href="@{/marketplace/checkout/pagar/{id}(id=${c.id})}" class="btn btn-warning fw-bold w-100 rounded-pill shadow-sm">
                            <i class="fas fa-credit-card me-2"></i> Completar Pago
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
