<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pago Exitoso | PharmaSync')}"></head>
<body class="bg-light">

    <div class="container h-md-100 d-flex flex-column align-items-center justify-content-center py-5">
        <div class="card border-0 shadow-2xl rounded-5 p-5 text-center bg-white" style="max-width: 600px;">
            <div class="success-icon mb-4">
                <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center anima-bounce shadow-lg" style="width: 100px; height: 100px;">
                    <i class="fas fa-check fa-3x"></i>
                </div>
            </div>
            <h1 class="fw-900 border-bottom pb-4 mb-4">¡Compra registrada!</h1>
            <p class="lead text-muted mb-4" th:if="${success}" th:text="${success}">Tu pedido fue registrado correctamente.</p>
            <p class="lead text-muted mb-4" th:unless="${success}">Tu compra en el marketplace fue procesada. Revisa tus notificaciones para futuras actualizaciones.</p>
            
            <div class="bg-light rounded-4 p-4 mb-5 text-start">
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted fw-bold small">Número de Orden:</span>
                    <span class="fw-bold text-dark">#PS-2026-X123</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted fw-bold small">Fecha:</span>
                    <span class="text-dark" th:text="${#calendars.format(#calendars.createNow(), 'dd/MM/yyyy HH:mm')}"></span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted fw-bold small">Estado del Pago:</span>
                    <span class="badge bg-success rounded-pill px-3">APROBADO</span>
                </div>
            </div>

            <div class="d-flex flex-column gap-3">
                <a th:href="@{/marketplace}" class="btn btn-primary rounded-pill py-3 fw-bold shadow-lg">
                    <i class="fas fa-shopping-bag me-2"></i> Seguir Comprando
                </a>
                <a th:href="@{/}" class="btn btn-link text-muted small text-decoration-none">Volver al Inicio</a>
            </div>
        </div>
    </div>

    <style>
        body, html { height: 100%; }
        .fw-900 { font-family: 'Readex Pro', sans-serif; font-weight: 800; }
        .shadow-2xl { box-shadow: 0 40px 100px -20px rgba(0,0,0,0.1); }
        .anima-bounce { animation: bounce 1.5s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>

    <script th:inline="javascript">
        // Clear cart on success
        localStorage.removeItem('pharmasync_cart');
    </script>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
