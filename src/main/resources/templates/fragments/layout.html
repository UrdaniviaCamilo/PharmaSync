<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Droguería Londres'">Droguería Londres</title>
    
    <!-- Google Fonts: Inter & Readex Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet JS Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Theme System -->
    <link rel="stylesheet" th:href="@{/css/themes.css}">
    
    <!-- Sidebar Premium Styles -->
    <style th:replace="~{fragments/sidebar-admin :: style}"></style>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
    </style>

    <!-- Apply Theme Class Immediately (before body renders) -->
    <script th:inline="javascript">
        (function() {
            var tema = /*[[${tema}]]*/ 'light';
            if (tema && tema !== 'light' && tema !== '') {
                document.addEventListener('DOMContentLoaded', function() {
                    document.body.classList.add('theme-' + tema);
                });
                // Also apply immediately to html for instant styling
                document.documentElement.classList.add('theme-' + tema);
            }
        })();
    </script>
</head>
<body>
    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
                integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <script th:src="@{/js/main.js}"></script>
        <!-- Sidebar Premium Scripts -->
        <script th:replace="~{fragments/sidebar-admin :: scripts}"></script>
    </div>
</body>
</html>
