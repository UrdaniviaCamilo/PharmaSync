<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="sidebar">
    <aside class="sidebar bg-dark text-white shadow-lg d-flex flex-column" id="sidebar">
        <!-- Logo and Platform Brand -->
        <div class="sidebar-header p-4 d-flex align-items-center bg-black bg-opacity-25">
            <div class="brand-icon me-3 p-2 bg-warning text-dark rounded-3 shadow-sm rotate-n-15">
                <i class="fas fa-microchip fa-lg"></i>
            </div>
            <div class="brand-text">
                <h6 class="fw-bold mb-0 text-uppercase ls-2">Pharma<span class="text-warning">Sync</span></h6>
                <span class="x-small text-white text-opacity-50 fw-bold">CONTROL MAESTRO</span>
            </div>
        </div>

        <!-- Profile Mini-Section -->
        <div class="sidebar-user p-4 border-bottom border-white border-opacity-10 d-flex align-items-center">
            <div class="user-avatar-container me-3">
                <img th:src="${usuario.fotoPerfil != null && !usuario.fotoPerfil.isEmpty() ? usuario.fotoPerfil : 'https://ui-avatars.com/api/?name=' + usuario.nombres + '+' + usuario.apellidos + '&background=f39c12&color=fff'}" 
                     class="rounded-circle shadow-sm border border-2 border-warning" width="45" height="45" style="object-fit: cover;">
            </div>
            <div class="user-info-text overflow-hidden">
                <div class="small fw-bold text-truncate" th:text="${usuario.nombres + ' ' + usuario.apellidos}">Admin Maestro</div>
                <div class="x-small text-warning fw-bold text-uppercase opacity-75">Control Global</div>
            </div>
        </div>

        <!-- Navigation Menu -->
        <div class="sidebar-nav flex-grow-1 py-4 overflow-auto">
            <div class="px-4 mb-3 small text-white text-opacity-25 fw-bold text-uppercase ls-1">PLATAFORMA</div>
            
            <a th:href="@{/super-admin/dashboard}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none text-white opacity-75" th:classappend="${paginaActiva == 'dashboard_global'} ? 'active bg-primary bg-opacity-25 border-start border-4 border-warning' : ''">
                <div class="nav-icon me-3"><i class="fas fa-network-wired"></i></div>
                <span class="nav-text small fw-bold">Vista Global</span>
            </a>

            <div class="px-4 mt-4 mb-3 small text-white text-opacity-25 fw-bold text-uppercase ls-1">GESTIÓN</div>

            <a th:href="@{/super-admin/negocios}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none text-white opacity-75" th:classappend="${paginaActiva == 'negocios'} ? 'active bg-primary bg-opacity-25 border-start border-4 border-warning' : ''">
                <div class="nav-icon me-3"><i class="fas fa-building"></i></div>
                <span class="nav-text small">Negocios Conectados</span>
            </a>

            <a th:href="@{/super-admin/usuarios}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none text-white opacity-75" th:classappend="${paginaActiva == 'usuarios_global'} ? 'active bg-primary bg-opacity-25 border-start border-4 border-warning' : ''">
                <div class="nav-icon me-3"><i class="fas fa-users-cog"></i></div>
                <span class="nav-text small">Usuarios Globales</span>
            </a>

            <a th:href="@{/super-admin/reportes}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none text-white opacity-75" th:classappend="${paginaActiva == 'reportes_global'} ? 'active bg-primary bg-opacity-25 border-start border-4 border-warning' : ''">
                <div class="nav-icon me-3"><i class="fas fa-chart-pie"></i></div>
                <span class="nav-text small">Analíticas Globales</span>
            </a>
            <div class="px-4 mt-4 mb-3 small text-white text-opacity-25 fw-bold text-uppercase ls-1">SOPORTE Y CLIENTES</div>

            <a th:href="@{/super-admin/reclamaciones}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none text-white opacity-75" th:classappend="${paginaActiva == 'reclamaciones'} ? 'active bg-primary bg-opacity-25 border-start border-4 border-warning' : ''">
                <div class="nav-icon me-3"><i class="fas fa-book-open text-warning"></i></div>
                <span class="nav-text small flex-grow-1">Libro Reclamaciones</span>
                <span class="badge bg-danger rounded-pill shadow-sm" th:if="${cantidadReclamacionesPendientes > 0}" th:text="${cantidadReclamacionesPendientes}">0</span>
            </a>

            <div class="px-4 mt-4 mb-3 small text-white text-opacity-25 fw-bold text-uppercase ls-1">SISTEMA AVANZADO</div>

            <a th:href="@{/super-admin/auditoria}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none text-white opacity-75" th:classappend="${paginaActiva == 'auditoria'} ? 'active bg-primary bg-opacity-25 border-start border-4 border-warning' : ''">
                <div class="nav-icon me-3"><i class="fas fa-shield-alt"></i></div>
                <span class="nav-text small">Auditoría / Logs</span>
            </a>

            <a th:href="@{/super-admin/mantenimiento}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none text-white opacity-75" th:classappend="${paginaActiva == 'mantenimiento'} ? 'active bg-primary bg-opacity-25 border-start border-4 border-warning' : ''">
                <div class="nav-icon me-3"><i class="fas fa-database"></i></div>
                <span class="nav-text small">Mantenimiento BD</span>
            </a>
            
            <a th:href="@{/perfil}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none text-white opacity-75" th:classappend="${paginaActiva == 'perfil'} ? 'active bg-primary bg-opacity-25 border-start border-4 border-warning' : ''">
                <div class="nav-icon me-3"><i class="fas fa-user-shield text-info"></i></div>
                <span class="nav-text small">Mi Perfil Maestro</span>
            </a>
        </div>
        <div class="sidebar-footer p-4 border-top border-white border-opacity-10">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-warning w-100 rounded-pill py-2 fw-bold shadow-sm d-flex align-items-center justify-content-center">
                    <i class="fas fa-sign-out-alt me-2 rotate-180"></i> Salir del Sistema
                </button>
            </form>
        </div>
    </aside>

    <style>
        .ls-2 { letter-spacing: 2px; }
        .rotate-n-15 { transform: rotate(-15deg); }
        .rotate-180 { transform: rotate(180deg); }
        .sidebar { min-width: 280px; max-width: 280px; height: 100vh; position: fixed; z-index: 1050; transition: 0.3s; top: 0; left: 0; }
        .nav-item:hover { background: rgba(255,255,255,0.05); opacity: 1 !important; transform: translateX(5px); transition: 0.2s; }
        .nav-item.active { opacity: 1 !important; }
        
        /* Global content adjustment for Super Admin */
        @media (min-width: 992px) {
            .main-content-super { margin-left: 280px !important; width: calc(100% - 280px) !important; }
        }
    </style>
</div>
</html>
