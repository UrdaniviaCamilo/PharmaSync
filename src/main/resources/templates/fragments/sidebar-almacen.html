<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="sidebar">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header border-bottom d-flex align-items-center justify-content-center px-3">
            <div class="sidebar-logo-container d-flex align-items-center justify-content-center flex-grow-1">
                <img th:src="@{${config.logoUrl != null ? config.logoUrl : '/images/logo-default.png'}}"
                     alt="Logo" class="sidebar-logo rounded-2 shadow-sm me-2">
                <span class="sidebar-title fw-bold text-truncate" th:text="${config.nombreFarmacia}">PharmaSync</span>
            </div>
            <button class="sidebar-toggle-btn ms-2" id="sidebarToggle">
                <i class="fas fa-chevron-left"></i>
            </button>
        </div>

        <div class="sidebar-user p-4 border-bottom text-center">
            <div class="user-avatar-container mx-auto mb-2 position-relative d-inline-block">
                <img th:src="@{${usuario.fotoPerfil != null && !usuario.fotoPerfil.isEmpty() ? usuario.fotoPerfil : 'https://ui-avatars.com/api/?name=' + usuario.nombres + '+' + usuario.apellidos + '&background=random'}}"
                     alt="Avatar" class="user-avatar rounded-circle shadow-sm border border-2 border-white" style="width: 60px; height: 60px; object-fit: cover;">
                <span class="user-status bg-success"></span>
            </div>
            <div class="user-info">
                <span class="user-name fw-bold small d-block text-dark" th:text="${usuario.nombres + ' ' + usuario.apellidos}">Nombre Empleado</span>
                <span class="user-role badge bg-primary text-white rounded-pill px-2 py-1 mt-1" style="font-size: 0.65rem;">ALMACÉN | LOGÍSTICA</span>
            </div>
        </div>

        <nav class="sidebar-nav py-3">
            <div class="nav-section mb-3">
                <span class="nav-section-title px-4 x-small text-uppercase text-muted fw-bold ls-1 mb-2 d-block">RESUMEN</span>
                <a th:href="@{/almacen/dashboard}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none" th:classappend="${paginaActiva == 'dashboard'} ? 'active' : ''">
                    <div class="nav-icon me-3"><i class="fas fa-th-large"></i></div>
                    <span class="nav-text small">Dashboard Almacén</span>
                </a>
                <a th:href="@{/admin/rendimiento}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none" th:classappend="${paginaActiva == 'rendimiento'} ? 'active' : ''">
                    <div class="nav-icon me-3 opacity-75"><i class="fas fa-user-chart"></i></div>
                    <span class="nav-text small">Mi Rendimiento</span>
                </a>
            </div>

            <div class="nav-section mb-3">
                <span class="nav-section-title px-4 x-small text-uppercase text-muted fw-bold ls-1 mb-2 d-block">INVENTARIO</span>
                <a th:href="@{/admin/productos}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none" th:classappend="${paginaActiva == 'productos'} ? 'active' : ''">
                    <div class="nav-icon me-3"><i class="fas fa-boxes"></i></div>
                    <span class="nav-text small flex-grow-1">Inventario General</span>
                    <span class="nav-badge badge bg-danger rounded-pill" th:if="${cantidadStockBajo > 0}" th:text="${cantidadStockBajo}">0</span>
                </a>
                <a th:href="@{/admin/categorias}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none" th:classappend="${paginaActiva == 'categorias'} ? 'active' : ''">
                    <div class="nav-icon me-3"><i class="fas fa-tags"></i></div>
                    <span class="nav-text small">Categorías</span>
                </a>
                <a th:href="@{/admin/productos?filtro=vencimiento}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none" th:classappend="${paginaActiva == 'vencimientos'} ? 'active' : ''">
                    <div class="nav-icon me-3 text-warning"><i class="fas fa-calendar-times"></i></div>
                    <span class="nav-text small">Vencimientos</span>
                </a>
                <a th:href="@{/almacen/stock/ingreso}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none" th:classappend="${paginaActiva == 'kardex'} ? 'active' : ''">
                    <div class="nav-icon me-3"><i class="fas fa-history"></i></div>
                    <span class="nav-text small">Kardex de Productos</span>
                </a>
            </div>

            <div class="nav-section mb-3">
                <span class="nav-section-title px-4 x-small text-uppercase text-muted fw-bold ls-1 mb-2 d-block">OPERACIONES</span>
                <a th:href="@{/admin/proveedores}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none" th:classappend="${paginaActiva == 'proveedores'} ? 'active' : ''">
                    <div class="nav-icon me-3"><i class="fas fa-truck"></i></div>
                    <span class="nav-text small">Proveedores</span>
                </a>
                <a th:href="@{/admin/codigos}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none" th:classappend="${paginaActiva == 'codigos'} ? 'active' : ''">
                    <div class="nav-icon me-3"><i class="fas fa-barcode"></i></div>
                    <span class="nav-text small">Etiquetar / Marcar</span>
                </a>
                <a th:href="@{/almacen/stock/ingreso}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none" th:classappend="${paginaActiva == 'nuevo-stock'} ? 'active' : ''">
                    <div class="nav-icon me-3 text-success"><i class="fas fa-plus-circle"></i></div>
                    <span class="nav-text small">Ingreso de Mercadería</span>
                </a>
            </div>

            <div class="nav-section mb-3">
                <span class="nav-section-title px-4 x-small text-uppercase text-muted fw-bold ls-1 mb-2 d-block">USUARIO</span>
                <a th:href="@{/perfil/ajustes}" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none" th:classappend="${paginaActiva == 'perfil'} ? 'active' : ''">
                    <div class="nav-icon me-3"><i class="fas fa-user-cog"></i></div>
                    <span class="nav-text small">Mi Perfil / Ajustes</span>
                </a>
                <form th:action="@{/logout}" method="post" id="logoutForm_almacen">
                    <button type="submit" class="nav-item d-flex align-items-center px-4 py-2 text-decoration-none text-danger border-0 bg-transparent w-100 text-start">
                        <div class="nav-icon me-3 opacity-75"><i class="fas fa-sign-out-alt"></i></div>
                        <span class="nav-text small">Cerrar Sesión</span>
                    </button>
                </form>
            </div>
        </nav>

        <div class="sidebar-footer p-4 border-top">
            <div class="sidebar-version small text-muted d-flex align-items-center">
                <i class="fas fa-code-branch me-2"></i>
                <span>v3.0.0 Premium</span>
            </div>
        </div>
    </aside>

    <!-- Styles and Scripts are the same as sidebar-admin.html -->
    <style th:replace="~{fragments/sidebar-admin :: style}"></style>
    <script th:replace="~{fragments/sidebar-admin :: script}"></script>
</div>
</html>
