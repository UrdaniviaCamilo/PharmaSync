<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gestión de Empresas | Super Admin')}"></head>
<body class="bg-light">

    <div th:replace="~{super-admin/dashboard :: nav}"></div>

    <main class="container-fluid p-4 p-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-5 border-bottom pb-3">
                <h2 class="fw-900 mb-0"><i class="fas fa-building text-primary me-3"></i>Todas las Droguerías</h2>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-primary rounded-pill px-4 fw-bold small"><i class="fas fa-file-excel me-2"></i>Exportar</button>
                    <div class="input-group" style="width: 300px;">
                        <input type="text" class="form-control rounded-pill-start ps-3 border-2" placeholder="Buscar por RUC o Nombre...">
                        <button class="btn btn-primary rounded-pill-end px-3"><i class="fas fa-search"></i></button>
                    </div>
                </div>
            </div>

            <div th:if="${success}" class="alert alert-success border-0 rounded-4 shadow-sm mb-4" th:text="${success}"></div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-dark text-white rounded-top-4">
                        <tr>
                            <th class="ps-3 py-3 border-0 small text-uppercase ls-1 fw-bold">ID / RUC</th>
                            <th class="py-3 border-0 small text-uppercase ls-1 fw-bold">Nombre Comercial / Razón Social</th>
                            <th class="py-3 border-0 small text-uppercase ls-1 fw-bold">Ubicación</th>
                            <th class="py-3 border-0 small text-uppercase ls-1 fw-bold">Estado</th>
                            <th class="text-end pe-3 py-3 border-0 small text-uppercase ls-1 fw-bold">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="emp : ${empresas}">
                            <td class="ps-3">
                                <span class="fw-bold d-block text-dark" th:text="${'#PS-00' + emp.id}">ID</span>
                                <span class="x-small text-muted" th:text="${emp.ruc}">RUC</span>
                            </td>
                            <td>
                                <h6 class="mb-0 fw-bold text-dark" th:text="${emp.nombreComercial}">Nombre</h6>
                                <span class="x-small text-muted" th:text="${emp.razonSocial}">Razón Social</span>
                            </td>
                            <td>
                                <span class="small fw-bold text-dark" th:text="${emp.departamento}">Departamento</span>
                                <span class="x-small text-muted d-block" th:text="${emp.distrito}">Distrito</span>
                            </td>
                            <td>
                                <span th:if="${emp.activo}" class="badge bg-success-subtle text-success rounded-pill px-3 fw-bold">ACTIVO</span>
                                <span th:if="${!emp.activo}" class="badge bg-danger-subtle text-danger rounded-pill px-3 fw-bold">SUSPENDIDO</span>
                            </td>
                            <td class="text-end pe-3">
                                <div class="btn-group">
                                    <form th:action="@{/super-admin/empresas/toggle/{id}(id=${emp.id})}" method="post">
                                        <button type="submit" class="btn btn-sm btn-outline-dark rounded-pill px-3 me-2 fw-bold" 
                                                th:text="${emp.activo ? 'Suspender' : 'Activar'}">Cambiar</button>
                                    </form>
                                    <button class="btn btn-sm btn-outline-primary rounded-circle shadow-sm" title="Ver Detalles"><i class="fas fa-eye"></i></button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <style>
        .fw-900 { font-family: 'Readex Pro', sans-serif; font-weight: 800; }
        .ls-1 { letter-spacing: 1px; }
        .x-small { font-size: 0.7rem; }
        .rounded-pill-start { border-top-left-radius: 50rem !important; border-bottom-left-radius: 50rem !important; }
        .rounded-pill-end { border-top-right-radius: 50rem !important; border-bottom-right-radius: 50rem !important; }
    </style>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
