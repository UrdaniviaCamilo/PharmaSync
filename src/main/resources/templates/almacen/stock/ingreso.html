<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Ingreso de Mercadería - Kardex')}"></head>
<body class="bg-light">

    <div th:replace="~{fragments/sidebar-selector :: sidebar}"></div>
    
    <div th:replace="~{fragments/navbar-universal :: navbar('Gestión de Inventario (Kardex)')}"></div>

    <main class="main-content mt-5 pt-3">
        <div class="container-fluid p-4">
            
            <div th:if="${success}" class="alert alert-success border-0 shadow-sm rounded-4 mb-4 alert-dismissible fade show">
                <i class="fas fa-check-circle me-2"></i> <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger border-0 shadow-sm rounded-4 mb-4 alert-dismissible fade show">
                <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row g-4">
                <!-- Left: Stock-In Form -->
                <div class="col-lg-5">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-header bg-white border-bottom-0 p-4">
                            <h5 class="mb-0 fw-bold"><i class="fas fa-truck-loading text-primary me-2"></i>Registrar Ingreso</h5>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/almacen/stock/ingreso/procesar}" method="post">
                                <div class="mb-4">
                                    <label class="form-label x-small fw-bold text-muted text-uppercase ls-1">Seleccionar Producto</label>
                                    <input type="text" id="productSearch" class="form-control form-control-modern mb-2" placeholder="Buscar por nombre o laboratorio...">
                                    <select name="productoId" id="productoSelect" class="form-select form-select-modern" required>
                                        <option value="">-- Elige un producto --</option>
                                        <option th:each="p : ${productos}" 
                                                th:value="${p.id}" 
                                                th:text="${p.nombre + ' (' + p.laboratorio + ') - Stock: ' + p.stock}"
                                                th:data-search="${p.nombre.toLowerCase() + ' ' + p.laboratorio.toLowerCase()}"></option>
                                    </select>
                                </div>
                                
                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label x-small fw-bold text-muted text-uppercase ls-1">Cantidad a Ingresar</label>
                                        <input type="number" name="cantidad" class="form-control form-control-modern" min="1" required placeholder="Ej. 50">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label x-small fw-bold text-muted text-uppercase ls-1">Motivo / Operación</label>
                                        <select name="motivo" class="form-select form-select-modern">
                                            <option value="Ingreso por Compra">Compra a Proveedor</option>
                                            <option value="Ajuste de Saldo">Ajuste / Inventario</option>
                                            <option value="Devolución">Devolución de Cliente</option>
                                            <option value="Transferencia">Transferencia de Sede</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label x-small fw-bold text-muted text-uppercase ls-1">Notas Adicionales (Opcional)</label>
                                    <textarea name="notas" class="form-control form-control-modern" rows="2" placeholder="N° de Factura, lote, etc."></textarea>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm">
                                    PROCESAR INGRESO <i class="fas fa-plus-circle ms-2"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Right: Recent Movements -->
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-header bg-white border-bottom-0 p-4 d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 fw-bold"><i class="fas fa-history text-muted me-2"></i>Movimientos Recientes (Kardex General)</h5>
                            <a th:href="@{/admin/productos}" class="btn btn-light btn-sm rounded-pill px-3">Ver Todo</a>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4 py-3 x-small fw-bold text-muted text-uppercase">Fecha / Hora</th>
                                        <th class="py-3 x-small fw-bold text-muted text-uppercase">Producto</th>
                                        <th class="py-3 x-small fw-bold text-muted text-uppercase text-center">Tipo</th>
                                        <th class="py-3 x-small fw-bold text-muted text-uppercase text-center">Cant.</th>
                                        <th class="pe-4 py-3 x-small fw-bold text-muted text-uppercase text-end">Historial</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="m : ${recientes}">
                                        <td class="ps-4 py-3">
                                            <div class="d-flex flex-column">
                                                <span class="small fw-bold text-dark" th:text="${#temporals.format(m.fecha, 'dd/MM/yy HH:mm')}">10/10/24</span>
                                                <span class="x-small text-muted" th:text="${m.usuario != null ? m.usuario.username : 'Sistema'}">Usuario</span>
                                            </div>
                                        </td>
                                        <td class="py-3">
                                            <span class="small fw-bold d-block text-truncate" style="max-width: 150px;" th:text="${m.producto.nombre}">Producto</span>
                                            <span class="x-small text-muted" th:text="${m.producto.laboratorio}">Lab</span>
                                        </td>
                                        <td class="py-3 text-center">
                                            <span class="badge rounded-pill px-2 py-1 x-small" 
                                                  th:classappend="${m.tipo == 'INGRESO' ? 'bg-success-subtle text-success' : 'bg-danger-subtle text-danger'}"
                                                  th:text="${m.tipo}">TIPO</span>
                                        </td>
                                        <td class="py-3 text-center fw-bold" th:text="${(m.tipo == 'INGRESO' ? '+' : '-') + m.cantidad}">10</td>
                                        <td class="pe-4 py-3 text-end">
                                            <a th:href="@{/almacen/stock/kardex/{id}(id=${m.producto.id})}" class="btn btn-sm btn-light rounded-circle shadow-xs">
                                                <i class="fas fa-eye text-primary"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(recientes)}">
                                        <td colspan="5" class="py-5 text-center text-muted">Aún no hay movimientos registrados.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <style>
        .form-control-modern, .form-select-modern {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .form-control-modern:focus, .form-select-modern:focus {
            background-color: #fff;
            border-color: #4361ee;
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        }
        .x-small { font-size: 0.7rem; }
        .ls-1 { letter-spacing: 0.5px; }
        .shadow-xs { box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    </style>

    <div th:replace="~{fragments/layout :: scripts}"></div>

    <script th:inline="javascript">
        // Basic predictive search for the dropdown
        const searchInput = document.getElementById('productSearch');
        const select = document.getElementById('productoSelect');
        const options = Array.from(select.options).slice(1);

        searchInput.addEventListener('input', function() {
            const term = this.value.toLowerCase().trim();
            select.innerHTML = '<option value="">-- Elige un producto --</option>';
            
            options.forEach(opt => {
                if (opt.getAttribute('data-search').includes(term)) {
                    select.appendChild(opt);
                }
            });
        });
    </script>
</body>
</html>
